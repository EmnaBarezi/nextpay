{% extends "base.html" %}
{% block title %}Create group{% endblock %}
{% block content %}
    <p><a href="/dashboard">&larr; Back to dashboard</a></p>
    <div class="card">
        <h1>Create a group</h1>
        <form method="post" action="/groups">
            <label for="name">Group name</label>
            <input type="text" id="name" name="name" required>

            <label for="amount_due">Amount each member pays (BIF)</label>
            <input type="number" id="amount_due" name="amount_due" min="1" required>

            <!-- the schedule: how often the members pay -->
            <label for="frequency">How often</label>
            <select id="frequency" name="frequency">
                <option value="weekly">Weekly</option>
                <option value="every 2 weeks">Every 2 weeks</option>
                <option value="monthly">Monthly</option>
            </select>

            <label for="start_date">First contribution date</label>
            <input type="date" id="start_date" name="start_date" required>

            <button class="wide" type="submit">Create group</button>
        </form>
    </div>
{% endblock %}
