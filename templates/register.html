{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
    <div class="card narrow">
        <h1>Create your account</h1>
        <form method="post" action="/register">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password (8 or more characters)</label>
            <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>

            <!-- the role decides if the user is a GroupAdmin or a GroupMember -->
            <label for="role">I am a</label>
            <select id="role" name="role">
                <option value="member">Member (I pay into a group)</option>
                <option value="admin">Admin (I run a group)</option>
            </select>

            <button class="wide" type="submit">Create account</button>
        </form>
        <p>Already have an account? <a href="/login">Log in</a></p>
    </div>
{% endblock %}
